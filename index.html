<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>
    <link rel="stylesheet" href="agenda.css">
</head>

<body>
    <h1>Lista de Tarefas</h1>
    <div class="formulario"><input id="tarefa" type="text" placeholder="Insira aqui sua tarefa" autocomplete="off"></input>
    <input id="seleciona-data" type="date" />
    <button onclick="adicionarTarefa()">Adicionar Tarefa</button></div>
    <div id="lista-de-tarefas"></div>
    <div id="mensagem-erro" style="color: red; text-align: center; margin-top: 10px;"></div>

    <script>
        let afazeres;
        const afazeresSalvos = JSON.parse(localStorage.getItem("afazeres"));
        if(Array.isArray(afazeresSalvos)){
        //if(Array.isArray(JSON.parse(localStorage.getItem("afazeres")))){
            afazeres = afazeresSalvos;
            //afazeres = JSON.parse(localStorage.getItem("afazeres"));
        }else{
       
        afazeres = [
            {
                nome: "Lavar louça",
                data: "15-08-2025",
                id: "id1"

            }
           
        ]};
       
        let salvarTarefas = () => localStorage.setItem("afazeres", JSON.stringify(afazeres));
        //console.log(JSON.sringify(afazeres));
        salvarTarefas();

        let adicionarTarefa = () => {
            const campoTarefa = document.getElementById("tarefa");
            const tarefa = campoTarefa.value.trim();

            const campoData = document.getElementById("seleciona-data");
            const prazo = campoData.value;

            const mensagemErro = document.getElementById("mensagem-erro");
            mensagemErro.innerText = "";

            if (tarefa === "" || prazo === "") {
            mensagemErro.innerText = "Por favor, insira uma tarefa e uma data válidas.";
            return;
    }

            const cron = "" + new Date().getTime();

            afazeres.push({
                nome: tarefa,
                data: prazo,
                id: cron
            });
           
            salvarTarefas();
            renderizar();

            campoTarefa.value = "";
            campoData.value = "";

            mensagemErro.innerText = "";
        }
        let apagarTarefa = (evento) => {
            const botaoApagar = evento.target;
            const idASerApagado = botaoApagar.id;
            afazeres = afazeres.filter((tarefa) =>{
                if( tarefa.id === idASerApagado ){
                    return false;
                }else{
                    return true;
                }
       
            });
            salvarTarefas();    
            renderizar();

        };    

        let renderizar = () => {
            document.getElementById("lista-de-tarefas").innerHTML = "";
            afazeres.sort((a, b) => new Date(a.data) - new Date(b.data));

            afazeres.forEach(
                (tarefa) => {
                    const elemento = document.createElement("div");
                    elemento.classList.add("card-tarefa");

                    const dataFormatada = tarefa.data.split("-").reverse().join("/");

                    const nomeTarefa = document.createElement("p");
                    nomeTarefa.innerText = tarefa.nome;

                    const dataTarefa = document.createElement("span");
                    dataTarefa.innerText = dataFormatada;
                    dataTarefa.classList.add("data");

                    const botaoApagar = document.createElement("button");
                    botaoApagar.innerText = "Apagar";
                    botaoApagar.id = tarefa.id;
                    botaoApagar.onclick = apagarTarefa;

                    elemento.appendChild(nomeTarefa);
                    elemento.appendChild(dataTarefa);
                    elemento.appendChild(botaoApagar);

                    const listaDeTarefas = document.getElementById("lista-de-tarefas");
                    listaDeTarefas.appendChild(elemento);
                });
            }

        renderizar();
    </script>
</body>

</html>
